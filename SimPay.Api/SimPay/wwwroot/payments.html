<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimPay - Gestión de pagos</title>
    <link rel="stylesheet" href="/css/styles.css?v=2">
</head>
<body>
    <header class="app-header">
        <div>
            <h1>SimPay</h1>
            <p>Gestión simulada de pagos</p>
        </div>

        <button id="logout-button" class="secondary-button" type="button">
            Cerrar sesión
        </button>
    </header>

    <main class="payments-container">
        <section class="payments-card">
            <h2 id="form-title">Registrar pago</h2>

            <form id="payment-form">
                <input id="payment-id" type="hidden">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="source-account-id">Cuenta de origen</label>
                        <input id="source-account-id"
                               type="text"
                               placeholder="GUID de la cuenta"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="destination-account-id">
                            Cuenta de destino
                        </label>
                        <input id="destination-account-id"
                               type="text"
                               placeholder="GUID de la cuenta"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Monto</label>
                        <input id="amount"
                               type="number"
                               min="0.01"
                               max="1000000"
                               step="0.01"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="currency">Moneda</label>
                        <input id="currency"
                               type="text"
                               minlength="3"
                               maxlength="3"
                               placeholder="DOP"
                               required>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Descripción</label>
                        <input id="description"
                               type="text"
                               maxlength="200"
                               required>
                    </div>
                </div>

                <p id="payment-message" class="message" aria-live="polite"></p>

                <div class="form-actions">
                    <button id="save-button" type="submit">
                        Guardar pago
                    </button>

                    <button id="cancel-button"
                            class="secondary-button hidden"
                            type="button">
                        Cancelar edición
                    </button>
                </div>
            </form>
        </section>

        <section class="payments-card">
            <div class="section-heading">
                <h2>Pagos registrados</h2>

                <button id="refresh-button" class="secondary-button" type="button">
                    Actualizar lista
                </button>
            </div>

            <form id="filter-form" class="filter-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="filter-status">Estado</label>
                        <select id="filter-status">
                            <option value="">Todos</option>
                            <option value="Pending">Pendiente</option>
                            <option value="Completed">Completado</option>
                            <option value="Rejected">Rechazado</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filter-currency">Moneda</label>
                        <input id="filter-currency"
                               type="text"
                               minlength="3"
                               maxlength="3"
                               placeholder="DOP">
                    </div>

                    <div class="form-group">
                        <label for="filter-min-amount">Monto mínimo</label>
                        <input id="filter-min-amount"
                               type="number"
                               min="0"
                               step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="filter-max-amount">Monto máximo</label>
                        <input id="filter-max-amount"
                               type="number"
                               min="0"
                               step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="filter-from-date">Fecha inicial</label>
                        <input id="filter-from-date" type="date">
                    </div>

                    <div class="form-group">
                        <label for="filter-to-date">Fecha final</label>
                        <input id="filter-to-date" type="date">
                    </div>
                </div>

                <p id="filter-message" class="message" aria-live="polite"></p>

                <div class="form-actions">
                    <button id="apply-filters-button" type="submit">
                        Aplicar filtros
                    </button>

                    <button id="clear-filters-button"
                            class="secondary-button"
                            type="button">
                        Limpiar filtros
                    </button>
                </div>
            </form>

            <div class="table-container">
                <table id="payments-table">
                    <thead>
                        <tr>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Monto</th>
                            <th>Moneda</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="payments-body">
                    </tbody>
                </table>

                <p id="empty-message">No existen pagos registrados.</p>
            </div>
        </section>
    </main>

    <script src="/js/payments.js"></script>
</body>
</html>
