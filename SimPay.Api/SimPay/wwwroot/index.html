<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimPay - Iniciar sesión</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="login-container">
        <section class="card">
            <h1>SimPay</h1>
            <p class="subtitle">Sistema de pagos simulados</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input id="username"
                           name="username"
                           type="text"
                           maxlength="30"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password"
                           name="password"
                           type="password"
                           maxlength="30"
                           required>
                </div>

                <p id="login-message" class="message" aria-live="polite"></p>

                <button id="login-button" type="submit">
                    Iniciar sesión
                </button>
            </form>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
